apiVersion: v1
kind: Namespace
metadata:
  name: dc-ai-modernization
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dc-app-config
  namespace: dc-ai-modernization
data:
  FLASK_ENV: "production"
  PYTHONUNBUFFERED: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: dc-app-secrets
  namespace: dc-ai-modernization
type: Opaque
stringData:
  GOOGLE_API_KEY: "your-google-api-key-here"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-ai-modernization-gateway
  namespace: dc-ai-modernization
  labels:
    app: dc-ai-gateway
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dc-ai-gateway
  template:
    metadata:
      labels:
        app: dc-ai-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: dc-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: dc-app
        image: stksinha/industrial-ai-cloud-modernization:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: dc-app-config
        - secretRef:
            name: dc-app-secrets
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dc-ai-gateway-svc
  namespace: dc-ai-modernization
  labels:
    app: dc-ai-gateway
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: dc-ai-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dc-app-hpa
  namespace: dc-ai-modernization
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dc-ai-modernization-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dc-app-pdb
  namespace: dc-ai-modernization
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dc-ai-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dc-app-sa
  namespace: dc-ai-modernization
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dc-app-role
  namespace: dc-ai-modernization
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dc-app-rolebinding
  namespace: dc-ai-modernization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dc-app-role
subjects:
- kind: ServiceAccount
  name: dc-app-sa
  namespace: dc-ai-modernization
